<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Can you read Japan? — free 10-kanji quiz</title>
<meta name="description" content="10 kanji you'll really see in Japan. Tap an answer, hear a native speaker, get your score. Free, no sign-up.">
<link rel="icon" href="../../app-c194f65f3521a6032984/icon-192.png">
<style>
/* Kumiko 2026-10-27: TikTok videos get views but nobody opens the bio link — this free quiz is the reason to tap it.
   Words + audio are from the checked N5 set (site/n5/). The score screen leads to the N5 product on Etsy. */
:root{--navy:#1F3A5F;--red:#C0392B;--green:#3C7A5A;--gold:#F3D9A4;--bg:#FBF8F2;--line:#e4dccd;
  --jaf:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222;padding-bottom:env(safe-area-inset-bottom)}
.hero{color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 16px 20px;
  background:radial-gradient(circle at 88% 18%,var(--red) 0 34px,transparent 35px),linear-gradient(160deg,#1F3A5F 0%,#2B4C7E 60%,#3A5F95 100%)}
.hero>*{max-width:520px;margin-left:auto;margin-right:auto}
.tag{display:inline-block;background:var(--red);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.08em}
.hero h1{margin:10px 0 4px;font-size:28px;line-height:1.15}
.hero p{margin:0;opacity:.9;font-size:15px;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 6px}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.count{display:flex;justify-content:space-between;font-size:13px;color:#666}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;margin-top:10px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.where{font-size:14px;color:#8a6d2f;font-weight:700}
.kanji{font:700 104px/1.15 var(--jaf);margin:6px 0 2px;color:#1d1d1f}
.kanji.long{font-size:84px}
.q{font-size:17px;font-weight:700;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 8px;font-size:18px;font-weight:700;color:#222;cursor:pointer}
.opts button.ok{background:var(--green);border-color:var(--green);color:#fff}
.opts button.no{background:#f6dcd8;border-color:var(--red);color:var(--red)}
.opts button:disabled{cursor:default}
.ans{margin-top:14px;padding:12px;border-radius:14px;background:#E6F0EA;display:none}
.ans.show{display:block}
.ans b{font-size:22px}.ans .kana{font:600 18px var(--jaf);color:#3c4a42;margin-left:6px}
.ans button{margin-top:8px;border:0;background:none;color:var(--green);font-weight:700;font-size:15px;cursor:pointer}
.next{display:none;width:100%;margin-top:14px;border:0;border-radius:16px;padding:16px;background:var(--navy);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.next.show{display:block}
.end{text-align:center}
.score{font-size:64px;font-weight:900;color:var(--navy);margin:6px 0 0}
.rank{display:inline-block;background:var(--gold);border-radius:99px;padding:6px 16px;font-weight:800;margin:6px 0 10px}
.end p{color:#555;line-height:1.5;margin:6px 0}
.buy{display:block;text-align:center;text-decoration:none;background:var(--red);color:#fff;border-radius:16px;padding:16px 12px;font-size:18px;font-weight:800;margin:16px 0 8px;box-shadow:0 4px 12px rgba(192,57,43,.3)}
.buy small{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:3px}
.sub{display:block;text-align:center;text-decoration:none;border:2px solid var(--navy);color:var(--navy);border-radius:16px;padding:13px 12px;font-size:16px;font-weight:700;margin:8px 0}
.row{display:flex;gap:8px}.row button{flex:1;border:0;border-radius:14px;padding:12px;font-size:15px;font-weight:700;background:var(--line);color:#333;cursor:pointer}
.missed{text-align:left;margin:14px 0 0;padding:0;list-style:none}
.missed li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.missed .k{font:700 30px var(--jaf);min-width:64px;text-align:center}
.missed button{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer}
footer{text-align:center;font-size:12px;color:#888;padding:8px 16px 24px}
footer a{color:#888}
</style>
</head><body>
<div class="hero">
  <span class="tag">FREE QUIZ</span>
  <h1>Can you read Japan?</h1>
  <p>10 kanji you'll really see on a trip. Tap your answer and hear how a native speaker says it.</p>
</div>
<main id="app"></main>
<footer>Ink and Kanji · <a href="../../">All our Japanese guides</a></footer>

<script>
const AUDIO = "../../n5/";
const ETSY = "https://serendipity0615.etsy.com/listing/4600979558?ref=free_quiz", PRICE = "$12.99";
// kanji, kana, romaji, meaning, where you see it, audio, wrong answers
const QS = [
  ["駅", "えき", "eki", "station", "On every train sign", "n5-66-1", ["temple", "exit", "ticket"]],
  ["円", "えん", "en", "yen", "On every price tag", "n5-14-1", ["sale", "tax", "price"]],
  ["水", "みず", "mizu", "water", "On bottles and vending machines", "n5-18-2", ["tea", "milk", "ice"]],
  ["山", "やま", "yama", "mountain", "In place names, like Mt. Fuji", "n5-69-2", ["river", "island", "forest"]],
  ["電車", "でんしゃ", "densha", "train", "At every station", "n5-74-1", ["bus", "taxi", "subway map"]],
  ["店", "みせ", "mise", "shop", "Above shop doors", "n5-67-2", ["house", "hotel", "school"]],
  ["雨", "あめ", "ame", "rain", "In the weather forecast", "n5-73-1", ["snow", "sun", "wind"]],
  ["魚", "さかな", "sakana", "fish", "On restaurant menus", "n5-78-2", ["meat", "rice", "egg"]],
  ["右", "みぎ", "migi", "right", "On direction signs", "n5-58-2", ["left", "up", "back"]],
  ["本", "ほん", "hon", "book", "At bookstores", "n5-76-1", ["paper", "letter", "map"]],
];
const RANKS = [[10, "Kanji Master 🏆"], [8, "Ready for Japan ✈️"], [5, "Getting there 🚃"], [0, "Fresh off the plane 🛬"]];
const app = document.getElementById("app");
let i = 0, score = 0, missed = [];
const play = f => { try { new Audio(AUDIO + f + ".mp3").play(); } catch (e) {} };
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);

function ask() {
  const [k, kana, ro, mean, where, au, wrong] = QS[i];
  app.innerHTML = `
    <div class="count"><span>Question ${i + 1} of ${QS.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${i / QS.length * 100}%"></i></div>
    <div class="card">
      <div class="where">📍 ${where}</div>
      <div class="kanji${k.length > 1 ? " long" : ""}">${k}</div>
      <div class="q">What does it mean?</div>
      <div class="opts">${shuffle([mean, ...wrong]).map(o => `<button>${o}</button>`).join("")}</div>
      <div class="ans"><b>${ro}</b><span class="kana">${kana}</span> = ${mean}<br><button>🔊 Hear it again</button></div>
      <button class="next">${i + 1 < QS.length ? "Next ›" : "See my score ›"}</button>
    </div>`;
  const btns = [...app.querySelectorAll(".opts button")];
  btns.forEach(b => b.onclick = () => {
    const right = b.textContent === mean;
    if (right) score++; else missed.push(QS[i]);
    btns.forEach(x => { x.disabled = true; if (x.textContent === mean) x.classList.add("ok"); });
    if (!right) b.classList.add("no");
    play(au);
    app.querySelector(".ans").classList.add("show");
    app.querySelector(".next").classList.add("show");
  });
  app.querySelector(".ans button").onclick = () => play(au);
  app.querySelector(".next").onclick = () => { i++; i < QS.length ? ask() : end(); window.scrollTo(0, 0); };
}

function end() {
  const rank = RANKS.find(r => score >= r[0])[1];
  app.innerHTML = `
    <div class="card end">
      <div>You read</div>
      <div class="score">${score}/${QS.length}</div>
      <div class="rank">${rank}</div>
      <p>These 10 are all from the <b>JLPT N5</b> list, the 103 kanji every beginner learns first.</p>
      <a class="buy" href="${ETSY}">Learn all 103 with native audio · ${PRICE}<small>Instant download on Etsy · works on your phone</small></a>
      <a class="sub" href="../speak/">🎤 Next: try a real conversation free</a>
      <div class="row"><button id="share">📤 Share my score</button><button id="again">↻ Try again</button></div>
      ${missed.length ? `<ul class="missed">${missed.map(m => `<li><span class="k">${m[0]}</span><span><b>${m[2]}</b> = ${m[3]}</span><button data-a="${m[5]}">🔊</button></li>`).join("")}</ul>` : ""}
    </div>`;
  app.querySelectorAll(".missed button").forEach(b => b.onclick = () => play(b.dataset.a));
  app.querySelector("#again").onclick = () => { i = 0; score = 0; missed = []; ask(); };
  app.querySelector("#share").onclick = async () => {
    const text = `I read ${score}/10 Japanese kanji! Can you beat me?`, url = location.href.split("?")[0];
    try { if (navigator.share) await navigator.share({ text, url }); else { await navigator.clipboard.writeText(text + " " + url); app.querySelector("#share").textContent = "✓ Copied"; } } catch (e) {}
  };
  // inside TikTok / Instagram's own browser: try the phone's real browser once; TikTok often blocks that silently,
  // so if nothing happened within 0.9 s, open Etsy as a normal link (same as the shop page, Kumiko 2026-10-27)
  if (/musical_ly|BytedanceWebview|TikTok|Instagram|FBAN|FBAV|Line\/|MicroMessenger/.test(navigator.userAgent)) {
    const a = app.querySelector(".buy"), ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    a.addEventListener("click", e => {
      e.preventDefault();
      const u = a.href;
      try { location.href = ios ? "x-safari-" + u : "intent://" + a.host + a.pathname + a.search + "#Intent;scheme=https;S.browser_fallback_url=" + encodeURIComponent(u) + ";end"; } catch (err) {}
      setTimeout(() => { if (!document.hidden) location.href = u; }, 900);
    });
  }
}
ask();
</script>
</body></html>
