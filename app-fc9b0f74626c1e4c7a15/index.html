<style>
:root { --navy:#1F3A5F; --cream:#FBF8F2; --ink:#1d1d1f; --c:#C0392B; --green:#3C7A5A;

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--cream); color:var(--ink); font-family:var(--en); }
body { padding-bottom:env(safe-area-inset-bottom); }
button { font:inherit; border:0; cursor:pointer; color:inherit; background:none; }
.ja { font-family:var(--ja); }
.wrap { max-width:560px; margin:0 auto; }
header { position:sticky; top:0; z-index:5; background:var(--hc, var(--navy)); color:var(--cream);

header h1 { font-size:18px; font-weight:700; flex:1; line-height:1.2; }

.back { font-size:16px; font-weight:600; padding:8px 12px; margin:-8px 0 -8px -8px; border-radius:20px; }
.home { padding:16px; }
.hero { text-align:center; padding:18px 0 22px; }
.hero .sun { width:110px; height:110px; border-radius:50%; background:var(--c); margin:0 auto 16px; color:#fff; font:700 60px/110px var(--ja); }

.big-btn { display:flex; align-items:center; justify-content:space-between; width:100%; padding:26px 20px; margin-bottom:14px;

.one { font-size:13px; color:#666; margin:6px 2px 0; }

.so img { width:100%; display:block; }
.nav { display:flex; justify-content:space-between; align-items:center; margin-top:22px; }

.quiz { padding:16px; text-align:center; }
.opt { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; justify-content:center; }

.qtop { display:flex; justify-content:space-between; font-size:14px; color:#777; margin-bottom:14px; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }

.ans { margin-top:16px; font-size:16px; line-height:1.5; }
.ans .w { font:700 30px var(--ja); }
.score { font-size:56px; font-weight:800; color:var(--navy); margin:20px 0 6px; }

.go { display:block; width:100%; padding:20px; border-radius:16px; background:var(--navy); color:#fff; font-size:21px; font-weight:700; margin-top:12px; }
.go.alt { background:#eee8dc; color:#555; }
.err { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:20; background:#333; color:#fff;

// ---------- audio (same engine as the other apps: plays on the same screen, works offline)
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, current = null, playingBtn = null;
const buffers = new Map();
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
function stopAudio() {
  if (current) { try { current.onended = null; current.stop(); } catch (e) {} current = null; }
  if (playingBtn) { playingBtn.classList.remove("on"); playingBtn = null; }
}
async function play(url, btn) {
  stopAudio();
  const me = btn || {classList: {remove() {}}};
  if (btn) btn.classList.add("on");
  playingBtn = me;
  try {
    if (!AC) { const a = new Audio(url); a.onended = stopAudio; await a.play(); current = {stop: () => a.pause()}; return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    let buf = buffers.get(url);
    if (!buf) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const raw = await res.arrayBuffer();
      buf = await new Promise((ok, ng) => ctx.decodeAudioData(raw, ok, ng));
      buffers.set(url, buf);
    }
    if (playingBtn !== me) return;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    src.onended = () => { if (current === src) { current = null; stopAudio(); } };
    src.start(0); current = src;
  } catch (e) {
    stopAudio();
    toast("Sound could not load. Please connect to the internet once, then it works offline.");
  }
}
function toast(msg) {
  const d = document.createElement("div"); d.className = "err"; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}

// ---------- screens
function header(title, ja, back, col) {
  return `<header style="--hc:${col || "var(--navy)"}">${back ? `<button class="back" onclick="history.back()">◀ Back</button>` : ""}
    <h1>${title}${ja ? `<small>${ja}</small>` : ""}</h1></header>`;
}
function home() {
  let tip = "";
  try { if (!localStorage.getItem("tipClosed") && !matchMedia("(display-mode: standalone)").matches)
    tip = `<div class="tip" id="tip"><button onclick="closeTip()" aria-label="Close">×</button>

      iPhone: tap <b>Share</b> → <b>Add to Home Screen</b>.<br>Android: tap <b>⋮</b> → <b>Add to Home screen</b>.</div>`; } catch (e) {}
  return header(DATA.title, DATA.titleJa) + `<div class="wrap home">
    <div class="hero"><div class="sun">字</div><p>All ${K.length} N5 kanji. Tap ▶ to hear every example word,<br>

    <div class="note"><p><b>How to read a card:</b> on readings (from Chinese) are in katakana, kun readings (Japanese) in hiragana.
      Each example shows which reading it uses. <b>★</b> marks words with a special reading.</p>

}
function closeTip() { try { localStorage.setItem("tipClosed", "1"); } catch (e) {} document.getElementById("tip")?.remove(); }
function list() {
  const gs = DATA.groups.map(g => `<div class="gh">${esc(g.en)}<span>${esc(g.ja)}</span></div><div class="grid">` +
    g.k.map(k => { const c = K[idx(k)]; return `<button class="cell" onclick="go('#/k/${idx(k)}')"><div class="k">${k}</div><div class="r">${esc(c.en)}</div></button>`; }).join("") +
    `</div>`).join("");
  return header(`All ${K.length} kanji`, "漢字一覧", true) + `<div class="wrap">${gs}<p class="hint">Tap a kanji to open its card.</p></div>`;
}
function mark(w, k) { return [...w].map(ch => ch === k ? `<b>${esc(ch)}</b>` : esc(ch)).join(""); }
function card(i) {
  const c = K[i];
  const one = c.on.length + c.kun.length === 1;
  const ex = c.ex.map(e => `<div class="ex"><div style="flex:1">
      <div class="w">${mark(e.w, c.k)}<span class="tag">${esc(e.rd)}</span></div>
      <div class="wr">${esc(e.r)}</div><div class="we">${esc(e.e)}</div>
      ${e.h ? `<div class="snd">Sound change in this word: ${esc(e.h)}</div>` : ""}</div>
      <button class="play sm" aria-label="Play" onclick="play('${e.a}', this)">▶</button></div>`).join("");
  const sp = c.sp.map(e => `<div class="ex sp"><div style="flex:1">
      <div class="w">★ ${mark(e.w, c.k)}</div><div class="wr">${esc(e.r)}</div><div class="we">${esc(e.e)}</div>
      <div class="snd">${esc(e.y)}</div></div>
      <button class="play sm" aria-label="Play" onclick="play('${e.a}', this)">▶</button></div>`).join("");
  return header(`${c.k} — ${c.en}`, "", true) + `<div class="wrap card">
    <div class="top"><div class="bk">${c.k}</div><div><div class="en">${esc(c.en)}</div><div class="st">${c.n} stroke${c.n > 1 ? "s" : ""}</div>
      <div class="rd">${c.on.length ? `<div><b>On</b> <span class="ja">${c.on.join("・")}</span></div>` : ""}
        ${c.kun.length ? `<div><b>Kun</b> <span class="ja">${c.kun.join("・")}</span></div>` : ""}</div></div></div>
    ${one ? `<p class="one">This kanji has one main reading.</p>` : ""}
    <div class="sec">Examples — tap ▶ to hear</div>${ex}
    ${sp ? `<div class="sec">★ Special reading</div>${sp}` : ""}
    <div class="sec">Stroke order</div><div class="so"><img src="${c.so}" alt="Stroke order of ${c.k}"></div>
    <div class="nav"><button ${i ? "" : "disabled"} onclick="go('#/k/${i - 1}', true)">‹ ${i ? K[i - 1].k : ""}</button>
      <span style="color:#aaa;font-size:13px">${i + 1} / ${K.length}</span>
      <button ${i < K.length - 1 ? "" : "disabled"} onclick="go('#/k/${i + 1}', true)">${i < K.length - 1 ? K[i + 1].k : ""} ›</button></div></div>`;
}

  const o = (val, label) => `<button class="${qset.g === val ? "sel" : ""}" onclick="qset.g='${val}';render()">${label}</button>`;
  return header("Listening quiz", "聞き取りクイズ", true, "var(--green)") + `<div class="wrap quiz">
    <div class="hero"><div class="sun" style="background:var(--green)">聞</div>
      <p>Listen to a word, then tap the kanji you hear in it.<br>10 questions.</p></div>
    <p style="font-size:17px;font-weight:700;color:#555;margin:4px 0 12px">Choose kanji to practice:</p>
    <div class="opt">${o("all", "All " + K.length)}${DATA.groups.map((g, n) => o(String(n), esc(g.en))).join("")}</div>
    <button class="go" onclick="newQuiz()">Start ▶</button></div>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pool() {
  const ks = qset.g === "all" ? K.map(c => c.k) : DATA.groups[+qset.g].k;
  return ks.flatMap(k => K[idx(k)].ex.map(e => ({...e, k})));
}
function newQuiz(only) {
  try { localStorage.setItem("n5qset", JSON.stringify(qset)); } catch (e) {}
  const p = pool();
  // one word per kanji, so 10 questions = 10 different kanji
  const qs = only && only.length ? shuffle([...only]) :
    shuffle([...new Set(p.map(q => q.k))]).slice(0, 10).map(k => shuffle(p.filter(q => q.k === k))[0]);
  Q = {qs, i: 0, right: 0, missed: [], answered: false};
  go("#/q/play"); setTimeout(() => sayQ(), 250);
}
function sayQ() { const b = document.getElementById("qplay"); if (Q && b) play(Q.qs[Q.i].a, b); }
function quizPlay() {
  if (!Q) return quizStart();
  const q = Q.qs[Q.i];
  if (!Q.choices) {
    // wrong choices: never a kanji that is in the word itself
    const others = shuffle(K.map(c => c.k).filter(k => !q.w.includes(k)));
    Q.choices = shuffle([q.k, ...others.slice(0, 3)]);
  }
  const ch = Q.choices.map((k, n) => `<button id="c${n}" onclick="answer(${n})">${k}<small></small></button>`).join("");
  return header("Listening quiz", "", true, "var(--green)") + `<div class="wrap quiz">
    <div class="qtop"><span>Question ${Q.i + 1} / ${Q.qs.length}</span><span>✓ ${Q.right}</span></div>
    <button class="play" id="qplay" style="--c:var(--green);width:88px;height:88px;font-size:32px" onclick="sayQ()" aria-label="Play again">▶</button>
    <p class="hint" style="padding:10px 0 0">Which kanji is in this word? Tap ▶ to hear it again.</p>
    <div class="choices">${ch}</div><div id="after"></div></div>`;
}
function answer(n) {
  if (Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.i], ok = Q.choices[n] === q.k;
  Q.choices.forEach((k, m) => { document.querySelector(`#c${m} small`).textContent = K[idx(k)].en; });
  const right = Q.choices.indexOf(q.k);
  document.getElementById("c" + right).classList.add("ok");
  if (ok) Q.right++; else { document.getElementById("c" + n).classList.add("ng"); Q.missed.push(q); }
  play(q.a);
  const last = Q.i === Q.qs.length - 1;
  document.getElementById("after").innerHTML = `<div class="ans"><div class="w">${mark(q.w, q.k)}</div>${esc(q.r)} — ${esc(q.e)}</div>
    <button class="go" onclick="nextQ()">${last ? "See score" : "Next ›"}</button>`;
}
function nextQ() {
  Q.i++; Q.choices = null; Q.answered = false;
  if (Q.i >= Q.qs.length) return go("#/q/done", true);
  render(); setTimeout(sayQ, 150);
}
function quizDone() {
  if (!Q) return quizStart();
  const m = Q.missed;
  return header("Listening quiz", "", true, "var(--green)") + `<div class="wrap quiz">
    <div class="score">${Q.right} / ${Q.qs.length}</div>
    <p style="font-size:17px">${Q.right === Q.qs.length ? "Perfect! よくできました！" : Q.right >= 7 ? "Great job! Keep going." : "Good practice! Try again."}</p>
    ${m.length ? `<p style="margin-top:18px;color:#666">Practice these again:</p><div class="missed">${m.map(q => q.k).join(" ")}</div>
      <button class="go" onclick="newQuiz(Q.missed)">Practice missed (${m.length})</button>` : ""}
    <button class="go ${m.length ? "alt" : ""}" onclick="newQuiz()">New quiz</button>
    <button class="go alt" onclick="go('#/q', true)">Change settings</button></div>`;
}

function go(hash, replace) { replace ? location.replace(hash) : (location.hash = hash); }
function render() {
  if (!location.hash.startsWith("#/q/play")) stopAudio();
  const h = location.hash.split("/");
  if (h[1] === "list") app.innerHTML = list();
  else if (h[1] === "k" && K[+h[2]]) app.innerHTML = card(+h[2]);
  else if (h[1] === "q" && h[2] === "play") app.innerHTML = quizPlay();
  else if (h[1] === "q" && h[2] === "done") app.innerHTML = quizDone();
  else if (h[1] === "q") app.innerHTML = quizStart();
  else app.innerHTML = home();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();

if ("serviceWorker" in navigator) {
  const hadOld = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOld) location.reload(); });
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
}
</script>
</body></html>
