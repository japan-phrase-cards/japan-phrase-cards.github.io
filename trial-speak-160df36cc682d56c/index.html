<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Speak Japanese — trial</title>
<style>
:root{--navy:#1F3A5F;--red:#C0392B;--green:#3C7A5A;--bg:#FBF8F2;--line:#e4dccd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header button{background:none;border:0;color:#fff;font-size:15px;padding:4px 0;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:16px}
.scene{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;font-size:17px;cursor:pointer}
.scene small{display:block;color:#777;margin-top:4px}.ja{font-family:"Noto Sans JP","Yu Gothic",sans-serif}
.intro{color:#555;line-height:1.5;margin:4px 0 18px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.b{max-width:85%;border-radius:16px;padding:10px 14px;line-height:1.4}
.b .ja{font-size:19px}.b .ro{font-size:13px;color:#666}.b .en{font-size:13px;color:#555;margin-top:2px}
.them{background:#fff;border:1px solid var(--line);align-self:flex-start}.you{background:#E6F0EA;align-self:flex-end}
.who{font-size:12px;color:#888;margin-bottom:2px}.b button{background:none;border:0;color:var(--navy);font-size:14px;padding:4px 0 0;cursor:pointer}
.turn{background:#fff;border:2px solid var(--green);border-radius:16px;padding:16px;margin-top:6px}
.turn .say{font-size:13px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.turn .en{font-size:21px;font-weight:700;margin:4px 0 10px}
.turn .ja{font-size:22px}.turn .ro{color:#666;margin-top:2px}
.hidden .words{filter:blur(7px);cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btns button{font-size:15px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.btns .rec{background:var(--red);color:#fff;border:0;grid-column:1/-1;font-size:17px}
.btns .rec.on,.btns .check.on{background:#7a1f15}
.btns .check{background:var(--green);color:#fff;border:0;grid-column:1/-1;font-size:17px}
.btns .rec.second{background:#fff;color:var(--red);border:2px solid var(--red)}.btns .rec.second.on{color:#fff}.btns .next{background:var(--navy);color:#fff;border:0;grid-column:1/-1}
.btns button:disabled{opacity:.4}
.turn .words{display:flex;gap:12px;align-items:center}
.hear{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:18px;cursor:pointer}
.mic{display:block;width:100%;margin-top:16px;padding:20px 10px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:21px;font-weight:700;cursor:pointer}
.mic.on{background:#7a1f15}.mic:disabled{background:var(--green)}
.turn .next{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:17px;cursor:pointer}
.turn .next[hidden]{display:none}.ok{text-align:center}.ok.live{color:#555;font-size:18px}
.ok{margin-top:12px;font-size:15px;color:#9C4A1A;line-height:1.4}.ok.good{font-size:24px;font-weight:800;color:var(--green)}
.tip{font-size:13px;color:#777;margin-top:10px;line-height:1.4}.msg{color:var(--red);font-size:14px;margin-top:8px}
.done{text-align:center;padding:20px 0}.done button{font-size:16px;padding:12px 18px;border-radius:12px;border:0;background:var(--navy);color:#fff;margin:4px;cursor:pointer}
label.tg{display:flex;gap:8px;align-items:center;font-size:14px;color:#555;margin:0 0 12px}
</style></head><body>
<header><button id="back" hidden>‹ Back</button><h1 id="title">Speak Japanese</h1></header>
<main id="app"></main>
<script>
const S = [{"id": "konbini", "en": "At the convenience store", "ja": "コンビニで", "them": "Clerk", "lines": [{"who": "them", "kana": "いらっしゃいませ。", "ro": "Irasshaimase.", "en": "Welcome! (You don't need to answer.)", "ok": ""}, {"who": "them", "kana": "ふくろ ごりよう ですか？", "ro": "Fukuro goriyō desu ka?", "en": "Do you need a bag?", "ok": ""}, {"who": "you", "kana": "いいえ、だいじょうぶ です。", "ro": "Iie, daijōbu desu.", "en": "No, I'm fine.", "ok": "いいえ(大丈夫|だいじょうぶ)です"}, {"who": "them", "kana": "あたためますか？", "ro": "Atatamemasu ka?", "en": "Shall I heat it up?", "ok": ""}, {"who": "you", "kana": "はい、おねがい します。", "ro": "Hai, onegai shimasu.", "en": "Yes, please.", "ok": "はい(お願い|おねがい)します"}, {"who": "them", "kana": "おしはらいは どう されますか？", "ro": "Oshiharai wa dō saremasu ka?", "en": "How would you like to pay?", "ok": ""}, {"who": "you", "kana": "カードで おねがい します。", "ro": "Kādo de onegai shimasu.", "en": "By card, please.", "ok": "かーどで(お願い|おねがい)します"}]}, {"id": "restaurant", "en": "At a restaurant", "ja": "レストランで", "them": "Server", "lines": [{"who": "them", "kana": "いらっしゃいませ。なんめいさま ですか？", "ro": "Irasshaimase. Nanmei-sama desu ka?", "en": "Welcome! How many people?", "ok": ""}, {"who": "you", "kana": "ふたり です。", "ro": "Futari desu.", "en": "Two.", "ok": "(二人|2人|ふたり)です"}, {"who": "them", "kana": "ごちゅうもんは おきまり ですか？", "ro": "Gochūmon wa okimari desu ka?", "en": "Are you ready to order?", "ok": ""}, {"who": "you", "kana": "これを ください。", "ro": "Kore o kudasai.", "en": "This one, please.", "ok": "これを?(ください|下さい)"}, {"who": "them", "kana": "おのみものは いかが ですか？", "ro": "Onomimono wa ikaga desu ka?", "en": "Would you like something to drink?", "ok": ""}, {"who": "you", "kana": "おみずを ください。", "ro": "Omizu o kudasai.", "en": "Water, please.", "ok": "(お水|おみず)を?(ください|下さい)"}]}, {"id": "michi", "en": "Asking the way", "ja": "みちを きく", "them": "Person on the street", "lines": [{"who": "you", "kana": "すみません、えきは どこ ですか？", "ro": "Sumimasen, eki wa doko desu ka?", "en": "Excuse me, where is the station?", "ok": "(すみません|すいません)(駅|えき)は(どこ|何処)ですか"}, {"who": "them", "kana": "この みちを まっすぐ いって、みぎ です。", "ro": "Kono michi o massugu itte, migi desu.", "en": "Go straight along this street, then it's on the right.", "ok": ""}, {"who": "you", "kana": "ありがとう ございます。", "ro": "Arigatō gozaimasu.", "en": "Thank you very much.", "ok": "(ありがとう|有難う)(ございます|御座います)"}]}];
const app = document.getElementById("app"), back = document.getElementById("back"), title = document.getElementById("title");
let rec = null, chunks = [], mine = null, stream = null, hide = false, heard = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const kata = s => s.normalize("NFKC").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kata(s).replace(/[\s、。,.!?！？「」『』]/g, "");

// Sound plays through Web Audio, not an <audio> player: on iPhone the <audio> player gets in the way of voice typing
// (it works once, then hears nothing) and sounds quiet after the mic is used. Known WebKit problem
// (github.com/WebAudio/web-speech-api/issues/96, bugs.webkit.org/show_bug.cgi?id=225298).
let actx = null, cur = null, playId = 0;
const bufs = {};
function audioCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state !== "running") actx.resume();
  return actx;
}
function stopSound() { playId++; if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } }
async function play(src) {
  stopSound();
  const id = playId;
  try {
    const c = audioCtx();   // first call is inside a tap, so the iPhone allows sound
    if (!bufs[src]) bufs[src] = await c.decodeAudioData(await (await fetch(src)).arrayBuffer());
    if (id !== playId) return;   // another sound was started meanwhile
    await new Promise(r => {
      const n = c.createBufferSource();
      n.buffer = bufs[src]; n.connect(c.destination);
      n.onended = () => { if (cur === n) cur = null; r(); };
      cur = n; n.start();
    });
  } catch (e) {}
}

// One voice-typing object for the whole visit, started again for each answer (iPhone is steadier this way).
let recog = null, recogBusy = false, hearId = 0;

function hear(match, onText) {
  // the phone's voice typing (Siri / Google): turns what you say into text, for the OK check. Needs the internet.
  // Words come in while you speak; as soon as they match, it says OK (no waiting for the end).
  if (!SR) return null;
  if (!recog) {
    recog = new SR();
    recog.lang = "ja-JP"; recog.interimResults = true; recog.maxAlternatives = 5; recog.continuous = false;
  }
  const r = recog, texts = [], id = ++hearId;   // id: old timers must not stop a newer listening
  let error = "", finish;
  const done = new Promise(res => finish = res);
  r.onresult = e => {
    const now = [];
    for (const x of e.results) for (const a of x) now.push(a.transcript);
    now.push([...e.results].map(x => x[0].transcript).join(""));   // everything so far, last = best guess
    texts.push(...now);
    if (onText) onText(now[now.length - 1]);
    if (match && now.some(match)) { finish({texts, error: ""}); try { r.stop(); } catch (e2) {} }   // stop gently, not abort
  };
  r.onerror = e => { error = e.error; };
  r.onend = () => { recogBusy = false; finish({texts, error}); };
  const go = () => { recogBusy = true; try { r.start(); } catch (e) { recogBusy = false; error = e.name; finish({texts, error}); } };
  if (!recogBusy) go();   // straight away, inside the tap
  else {   // the last listening is still closing: wait for it (max 4 s)
    const t0 = Date.now(), w = setInterval(() => {
      if (!recogBusy || Date.now() - t0 > 4000) { clearInterval(w); if (recogBusy) { try { r.abort(); } catch (e) {} recogBusy = false; } go(); }
    }, 100);
  }
  let timer;
  const late = new Promise(res => timer = setTimeout(() => { if (id === hearId) try { r.stop(); } catch (e) {} res({texts, error: error || "timeout"}); }, 9000));
  done.then(() => clearTimeout(timer));
  return {stop() { if (id === hearId) try { r.stop(); } catch (e) {} }, done: Promise.race([done, late])};
}

function okText(res, pattern) {
  // [class, text] for the OK check result
  if (!res) return ["", ""];
  const re = new RegExp(kata(pattern));   // not norm(): it would remove the "?" of the pattern
  if (res.texts.some(t => re.test(norm(t)))) return ["good", "✓ OK!"];
  if (res.texts.length) return ["", `We heard: 「${res.texts[res.texts.length - 1]}」. Try again!`];
  const why = {"network": "The OK check needs the internet.",
    "not-allowed": "The OK check is off. On iPhone: Settings → General → Keyboard → turn on Dictation.",
    "service-not-allowed": "The OK check is off. On iPhone: Settings → General → Keyboard → turn on Dictation.",
    "no-speech": "We didn't hear anything. Try again, a little louder.",
    "audio-capture": "The OK check couldn't use the microphone."}[res.error || "no-speech"];
  return ["", (why || "The OK check didn't work this time.") + (res.error ? ` [${res.error}]` : "")];   // [code] helps find the cause in the trial
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function home() {
  stopRec(); back.hidden = true; title.textContent = "Speak Japanese";
  app.innerHTML = `<p class="intro">Practice real conversations. The app plays the other person.
    On your turn, say your line out loud, record yourself, and compare with the model voice.</p>` +
    S.map((s, n) => `<button class="scene" data-n="${n}">${esc(s.en)} <span class="ja">· ${esc(s.ja)}</span>
      <small>${s.lines.filter(l => l.who === "you").length} lines to say</small></button>`).join("") +
    `<button class="scene" id="mic">🎤 Microphone check <small>Trial version 9 · tap, say something for 3 seconds, then say something in Japanese</small></button><pre id="diag" style="white-space:pre-wrap;font-size:12px"></pre>`;
  app.querySelectorAll(".scene[data-n]").forEach(b => b.onclick = () => scene(+b.dataset.n));
  document.getElementById("mic").onclick = micCheck;
}

async function micCheck() {
  // trial only: shows each step, so a screenshot tells us where recording stops on a phone
  const d = document.getElementById("diag"), say = m => d.textContent += m + "\n";
  d.textContent = "";
  say("Browser: " + navigator.userAgent);
  say("Secure page: " + window.isSecureContext);
  say("Microphone API: " + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
  say("Recorder: " + (typeof MediaRecorder !== "undefined"));
  try {
    if (navigator.permissions) { try { say("Permission: " + (await navigator.permissions.query({name: "microphone"})).state); } catch (e) { say("Permission: (can't ask)"); } }
    const st = await navigator.mediaDevices.getUserMedia({audio: true});
    say("Microphone: ON (" + st.getAudioTracks().map(t => t.label || "mic").join(", ") + ")");
    const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
    const r = type ? new MediaRecorder(st, {mimeType: type}) : new MediaRecorder(st), parts = [];
    r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    const done = new Promise(res => r.onstop = res);
    r.start(250); say("Recording 3 seconds… (" + (r.mimeType || type || "default") + ")");
    await new Promise(res => setTimeout(res, 3000));
    r.stop(); await done; st.getTracks().forEach(t => t.stop());
    const blob = new Blob(parts, {type: r.mimeType || type || "audio/mp4"});
    say("Recorded: " + blob.size + " bytes");
    say("Playing it back…");
    await play(URL.createObjectURL(blob));
    say("Done.");
    if (!SR) { say("Voice typing: not in this browser"); return; }
    say("Voice typing: say something in Japanese now…");
    const h = hear(), res = await h.done;
    say("Voice typing heard: " + (res.texts.length ? "「" + res.texts.slice(0, 3).join("」「") + "」" : "nothing") + (res.error ? " (" + res.error + ")" : ""));
  } catch (e) { say("STOPPED: " + e.name + ": " + e.message); }
}

function bubble(s, n, i) {
  const l = s.lines[i], src = `audio/${s.id}-${i + 1}.mp3`;
  const d = document.createElement("div");
  d.className = "b " + l.who;
  d.innerHTML = `<div class="who">${l.who === "you" ? "You" : esc(s.them)}</div><div class="ja">${esc(l.kana)}</div>
    <div class="ro">${esc(l.ro)}</div><div class="en">${esc(l.en)}</div><button>▶ Play</button>`;
  d.querySelector("button").onclick = () => play(src);
  return d;
}

async function scene(n) {
  const s = S[n]; back.hidden = false; title.textContent = s.en;
  app.innerHTML = `<div class="chat"></div><div id="turn"></div>`;
  const chat = app.querySelector(".chat");
  for (let i = 0; i < s.lines.length; i++) {
    if (S[n] !== s || !app.contains(chat)) return;
    if (s.lines[i].who === "them") {
      chat.append(bubble(s, n, i)); chat.lastChild.scrollIntoView({behavior: "smooth", block: "end"});
      await play(`audio/${s.id}-${i + 1}.mp3`);
      await new Promise(r => setTimeout(r, 400));
    } else {
      await yourTurn(s, i);
      if (!app.contains(chat)) return;
      chat.append(bubble(s, n, i));
    }
  }
  document.getElementById("turn").innerHTML = `<div class="done"><p><b>Well done!</b> 🎉</p>
    <button id="again">Try again</button><button id="other">Other scenes</button></div>`;
  document.getElementById("again").onclick = () => scene(n);
  document.getElementById("other").onclick = home;
}

function yourTurn(s, i) {
  // one big button: tap, say the line, the phone's voice typing checks it. OK → the conversation goes on by itself.
  const l = s.lines[i], model = `audio/${s.id}-${i + 1}.mp3`;
  const inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/.test(navigator.userAgent);
  const t = document.getElementById("turn");
  t.innerHTML = `<div class="turn"><div class="say">Your turn — say:</div><div class="en">${esc(l.en)}</div>
    <div class="words"><button class="hear" aria-label="Hear it">▶</button><div><div class="ja">${esc(l.kana)}</div><div class="ro">${esc(l.ro)}</div></div></div>
    ${SR ? '<button class="mic">🎤 Tap and say it</button>' : ""}
    <div class="ok"></div>
    <button class="next" ${SR ? "hidden" : ""}>Next ›</button>
    ${inApp ? '<div class="msg">For the OK check, open this page in Safari (iPhone) or Chrome (Android).</div>' : ""}
    </div>`;
  t.scrollIntoView({behavior: "smooth", block: "end"});
  const q = c => t.querySelector(c), ok = q(".ok");
  q(".hear").onclick = () => play(model);
  let misses = 0;
  return new Promise(r => {
    const go = () => { if (heard) heard.stop(); t.innerHTML = ""; r(); };
    q(".next").onclick = go;
    if (!SR) return;
    q(".mic").onclick = async () => {
      const b = q(".mic");
      if (heard) { heard.stop(); return; }
      stopSound();
      const re = new RegExp(kata(l.ok));
      const h = heard = hear(t2 => re.test(norm(t2)), t2 => { ok.className = "ok live"; ok.textContent = "「" + t2 + "」"; });
      b.classList.add("on"); b.textContent = "Listening… say it now"; ok.className = "ok"; ok.textContent = "";
      const res = await h.done;
      heard = null; b.classList.remove("on"); b.textContent = "🎤 Tap and say it";
      const [cls, txt] = okText(res, l.ok);
      ok.className = "ok " + cls; ok.textContent = txt;
      if (cls === "good") { b.disabled = true; await new Promise(z => setTimeout(z, 900)); go(); return; }
      misses++;
      if (misses >= 2 || (res.error && res.error !== "no-speech")) q(".next").hidden = false;
    };
  });
}

function cantRecord() {
  // apps like LINE or Instagram open links in their own small browser, which often has no microphone
  const inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger|GSA\//.test(navigator.userAgent);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined")
    return inApp ? "This app's built-in browser can't record. Please open this page in Safari (iPhone) or Chrome (Android)."
                 : "This browser can't record. Please open this page in Safari (iPhone) or Chrome (Android).";
  return "";
}

function stopRec() { if (rec && rec.state === "recording") rec.stop(); if (heard) heard.stop(); stopSound(); }
back.onclick = home;
home();
</script></body></html>
