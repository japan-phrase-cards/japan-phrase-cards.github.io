<title>Everyday Japanese, Morning to Night</title>
<style>
:root { --navy:#1F3A5F; --cream:#FBF8F2; --ink:#1d1d1f; --c:#C0392B;

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--cream); color:var(--ink); font-family:var(--en); }
body { padding-bottom:env(safe-area-inset-bottom); }
button { font:inherit; border:0; cursor:pointer; color:inherit; background:none; }
.ja { font-family:var(--ja); }
.wrap { max-width:560px; margin:0 auto; }
header { position:sticky; top:0; z-index:5; background:var(--hc, var(--navy)); color:var(--cream);

header h1 { font-size:18px; font-weight:700; flex:1; line-height:1.2; }

.home { padding:16px; }

.hero p { font-size:15px; line-height:1.5; color:#444; }
.big-btn { display:flex; align-items:center; justify-content:space-between; width:100%; padding:20px 18px; margin-bottom:10px;

.big-btn .ja { font-size:15px; font-weight:400; opacity:.9; }

.note { font-size:13px; line-height:1.5; color:#666; margin:16px 4px 8px; }

.cell .k { font:700 26px/1.15 var(--ja); }

.six { gap:4px; } .six .cell .k { font-size:min(22px, 6vw); letter-spacing:-1px; }

.card .sohint { font-size:12px; color:#999; }

.card .rom { font-size:34px; font-weight:800; margin-top:4px; }

.ex .lbl { font-size:11px; color:#999; text-transform:uppercase; letter-spacing:.5px; }
.ex .w { font:700 28px/1.3 var(--ja); } .ex .w b { color:var(--c); }

.qtop { display:flex; justify-content:space-between; font-size:14px; color:#777; margin-bottom:14px; }

.choices button { background:#fff; border:2px solid #e6e0d4; border-radius:16px; font:700 44px/1 var(--ja); padding:22px 0; }

.choices button.ng { background:#C0392B; border-color:#C0392B; color:#fff; }
.choices button small { display:block; font:600 14px var(--en); margin-top:6px; min-height:17px; }
.score { font-size:56px; font-weight:800; color:var(--navy); margin:20px 0 6px; }
.missed { font:700 26px/1.6 var(--ja); color:#C0392B; margin:10px 0 18px; letter-spacing:6px; }
.go { display:block; width:100%; padding:16px; border-radius:14px; background:var(--navy); color:#fff; font-size:18px; font-weight:700; margin-top:10px; }
.go.alt { background:#eee8dc; color:#555; }
.err { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:20; background:#333; color:#fff;
  border-radius:12px; padding:12px 16px; font-size:14px; text-align:center; }

.list { padding:8px 12px 24px; }
.row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; border:1px solid #ece5d8;
  border-radius:12px; padding:10px 10px 10px 14px; margin-bottom:6px; }
.row .t { flex:1; min-width:0; text-align:left; }
.opt-row[style] button { flex:1 0 30%; }
.row .k { font:700 19px/1.35 var(--ja); word-break:keep-all; }
.row .e { font-size:13px; color:#666; margin-top:1px; }
.phr { padding:22px 18px 28px; text-align:center; }
.phr .k { font:700 34px/1.35 var(--ja); word-break:keep-all; margin-top:8px; }
.phr .j { font:18px/1.4 var(--ja); color:#555; margin-top:8px; }
.phr .j small { display:block; font:11px var(--en); color:#aaa; }
.phr .r { font-size:20px; font-style:italic; color:#333; margin-top:14px; }
.phr .e { font-size:21px; font-weight:700; margin-top:6px; }
.when { text-align:left; background:#fff; border:1px solid #e6e0d4; border-radius:14px; padding:12px 16px; margin-top:24px; font-size:15px; line-height:1.5; }
.when .lbl { font-size:11px; color:#999; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
.tag { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:8px; color:#fff; margin-right:6px; text-transform:uppercase; }
.tag.casual { background:#D98E2B; } .tag.polite { background:#1F3A5F; }
.choices.txt { grid-template-columns:1fr; }
.choices.txt button { font:700 17px/1.35 var(--en); padding:14px 12px; text-align:left; }
.choices.ja button { font:700 20px/1.35 var(--ja); word-break:keep-all; }
.choices.txt button small { font:400 13px var(--ja); color:inherit; opacity:.85; }
.pairs { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; font-size:13px; margin-top:6px; }
.pairs td { padding:8px; border-bottom:1px solid #eee; } .pairs td.j { font:700 15px var(--ja); word-break:keep-all; }
</style>

<script>
const DATA = {"title": "Everyday Japanese, Morning to Night", "titleJa": "朝から夜までの日本語", "secs": [{"id": "morning", "en": "Morning", "ja": "朝", "col": "#D98E2B", "items": [{"k": "おはよう", "j": "", "r": "ohayō", "e": "Good morning", "t": "casual", "n": "to family and friends", "a": "../daily/morning-01.mp3"}, {"k": "おはようございます", "j": "", "r": "ohayō gozaimasu", "e": "Good morning", "t": "polite", "n": "to neighbors, at work or school", "a": "../daily/morning-02.mp3"}, {"k": "おきて!", "j": "起きて!", "r": "okite!", "e": "Wake up!", "t": "", "n": "To someone still in bed", "a": "../daily/morning-03.mp3"}, {"k": "よく ねた?", "j": "よく寝た?", "r": "yoku neta?", "e": "Did you sleep well?", "t": "casual", "n": "first thing in the morning", "a": "../daily/morning-04.mp3"}, {"k": "まだ ねむい", "j": "まだ眠い", "r": "mada nemui", "e": "I'm still sleepy", "t": "casual", "n": "", "a": "../daily/morning-05.mp3"}, {"k": "いま なんじ?", "j": "今何時?", "r": "ima nanji?", "e": "What time is it?", "t": "casual", "n": "", "a": "../daily/morning-06.mp3"}, {"k": "ちこく しちゃう!", "j": "遅刻しちゃう!", "r": "chikoku shichau!", "e": "I'm going to be late!", "t": "casual", "n": "when you're in a hurry", "a": "../daily/morning-07.mp3"}, {"k": "いただきます", "j": "", "r": "itadakimasu", "e": "(said before eating)", "t": "", "n": "Before every meal, hands together. No English word for it", "a": "../daily/morning-08.mp3"}, {"k": "おいしい!", "j": "美味しい!", "r": "oishii!", "e": "It's delicious!", "t": "", "n": "While eating", "a": "../daily/morning-09.mp3"}, {"k": "ごちそうさまでした", "j": "", "r": "gochisōsama deshita", "e": "Thank you for the meal", "t": "", "n": "After eating. \"Gochisōsama\" alone is casual", "a": "../daily/morning-10.mp3"}, {"k": "わすれもの ない?", "j": "忘れ物ない?", "r": "wasuremono nai?", "e": "Did you forget anything?", "t": "casual", "n": "before leaving home", "a": "../daily/morning-11.mp3"}, {"k": "かさ もった?", "j": "傘持った?", "r": "kasa motta?", "e": "Do you have your umbrella?", "t": "casual", "n": "on a rainy day", "a": "../daily/morning-12.mp3"}, {"k": "いってきます", "j": "行ってきます", "r": "ittekimasu", "e": "I'm off! (I'll be back)", "t": "", "n": "Said by the person leaving home", "a": "../daily/morning-13.mp3"}, {"k": "いってらっしゃい", "j": "行ってらっしゃい", "r": "itterasshai", "e": "Have a good day!", "t": "", "n": "Answer to \"ittekimasu\", said by the person staying", "a": "../daily/morning-14.mp3"}, {"k": "きを つけてね", "j": "気をつけてね", "r": "ki o tsukete ne", "e": "Take care", "t": "casual", "n": "to someone going out", "a": "../daily/morning-15.mp3"}]}, {"id": "day", "en": "Daytime", "ja": "昼", "col": "#3C7A5A", "items": [{"k": "こんにちは", "j": "", "r": "konnichiwa", "e": "Hello", "t": "", "n": "From late morning to evening. Not used with family", "a": "../daily/day-01.mp3"}, {"k": "はじめまして", "j": "初めまして", "r": "hajimemashite", "e": "Nice to meet you", "t": "", "n": "The first time you meet someone", "a": "../daily/day-02.mp3"}, {"k": "よろしく おねがいします", "j": "よろしくお願いします", "r": "yoroshiku onegai shimasu", "e": "Nice to meet you / I look forward to working with you", "t": "polite", "n": "after your name, or when you ask for help", "a": "../daily/day-03.mp3"}, {"k": "すみません", "j": "", "r": "sumimasen", "e": "Excuse me / Sorry", "t": "", "n": "To call someone, or a small \"sorry\"", "a": "../daily/day-04.mp3"}, {"k": "ありがとう", "j": "", "r": "arigatō", "e": "Thanks", "t": "casual", "n": "", "a": "../daily/day-05.mp3"}, {"k": "ありがとうございます", "j": "", "r": "arigatō gozaimasu", "e": "Thank you", "t": "polite", "n": "", "a": "../daily/day-06.mp3"}, {"k": "どういたしまして", "j": "", "r": "dō itashimashite", "e": "You're welcome", "t": "", "n": "Answer to \"thank you\"", "a": "../daily/day-07.mp3"}, {"k": "ごめんなさい", "j": "", "r": "gomen nasai", "e": "I'm sorry", "t": "", "n": "A real apology. \"Gomen\" alone is casual", "a": "../daily/day-08.mp3"}, {"k": "だいじょうぶ?", "j": "大丈夫?", "r": "daijōbu?", "e": "Are you OK?", "t": "casual", "n": "", "a": "../daily/day-09.mp3"}, {"k": "だいじょうぶです", "j": "大丈夫です", "r": "daijōbu desu", "e": "I'm OK / No, thank you", "t": "", "n": "Also a polite \"no thanks\"", "a": "../daily/day-10.mp3"}, {"k": "わかりました", "j": "分かりました", "r": "wakarimashita", "e": "I understand / OK", "t": "polite", "n": "when you agree to do something", "a": "../daily/day-11.mp3"}, {"k": "わかりません", "j": "分かりません", "r": "wakarimasen", "e": "I don't understand", "t": "polite", "n": "", "a": "../daily/day-12.mp3"}, {"k": "もう いちど おねがいします", "j": "もう一度お願いします", "r": "mō ichido onegai shimasu", "e": "Once more, please", "t": "polite", "n": "when you didn't catch it", "a": "../daily/day-13.mp3"}, {"k": "ゆっくり おねがいします", "j": "ゆっくりお願いします", "r": "yukkuri onegai shimasu", "e": "Slowly, please", "t": "polite", "n": "", "a": "../daily/day-14.mp3"}, {"k": "ちょっと まって", "j": "ちょっと待って", "r": "chotto matte", "e": "Wait a moment", "t": "casual", "n": ". Polite: \"chotto matte kudasai\"", "a": "../daily/day-15.mp3"}, {"k": "しつれいします", "j": "失礼します", "r": "shitsurei shimasu", "e": "Excuse me (for coming in)", "t": "polite", "n": "entering an office or a teacher's room", "a": "../daily/day-16.mp3"}, {"k": "おつかれさまです", "j": "お疲れ様です", "r": "otsukaresama desu", "e": "Thanks for your hard work", "t": "", "n": "At work: greeting coworkers, during or after work", "a": "../daily/day-17.mp3"}, {"k": "がんばって!", "j": "頑張って!", "r": "ganbatte!", "e": "Good luck! / You can do it!", "t": "casual", "n": "before a test, a game, hard work", "a": "../daily/day-18.mp3"}, {"k": "おなか すいた", "j": "お腹すいた", "r": "onaka suita", "e": "I'm hungry", "t": "casual", "n": "", "a": "../daily/day-19.mp3"}, {"k": "おひる なに たべる?", "j": "お昼何食べる?", "r": "ohiru nani taberu?", "e": "What do you want for lunch?", "t": "casual", "n": "", "a": "../daily/day-20.mp3"}, {"k": "いっしょに いこう", "j": "一緒に行こう", "r": "issho ni ikō", "e": "Let's go together", "t": "casual", "n": "", "a": "../daily/day-21.mp3"}, {"k": "どうぞ", "j": "", "r": "dōzo", "e": "Here you are / Please, go ahead", "t": "", "n": "When you hand something over or let someone go first", "a": "../daily/day-22.mp3"}, {"k": "おめでとう // ---------- audio (same engine as the travel cards: plays on the same screen, works offline)
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, current = null, playingBtn = null;
const buffers = new Map();
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
function stopAudio() {
  if (current) { try { current.onended = null; current.stop(); } catch (e) {} current = null; }

}
async function play(url, btn) {
  stopAudio();
  const me = btn || {classList: {remove() {}}};   // no button (tap on a chart cell) = nothing to animate
  if (btn) btn.classList.add("on");
  playingBtn = me;
  try {
    if (!AC) { const a = new Audio(url); a.onended = stopAudio; await a.play(); current = {stop: () => a.pause()}; return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    let buf = buffers.get(url);
    if (!buf) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const raw = await res.arrayBuffer();
      buf = await new Promise((ok, ng) => ctx.decodeAudioData(raw, ok, ng));
      buffers.set(url, buf);
    }
    if (playingBtn !== me) return;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    src.onended = () => { if (current === src) { current = null; stopAudio(); } };
    src.start(0); current = src;

    stopAudio();

}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const hadOld = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOld) location.reload(); });
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
}
</script>
