}], [{"k": "リャ", "r": "rya", "a": "../kana/k-rya.mp3"}, {"k": "リュ", "r": "ryu", "a": "../kana/k-ryu.mp3"}, {"k": "リョ", "r": "ryo", "a": "../kana/k-ryo.mp3"}, {"k": "ギャ", "r": "gya", "a": "../kana/k-gya.mp3"}, {"k": "ギュ", "r": "gyu", "a": "../kana/k-gyu.mp3"}, {"k": "ギョ", "r": "gyo", "a": "../kana/k-gyo.mp3"}], [{"k": "ジャ", "r": "ja", "a": "../kana/k-ja.mp3"}, {"k": "ジュ", "r": "ju", "a": "../kana/k-ju.mp3"}, {"k": "ジョ", "r": "jo", "a": "../kana/k-jo.mp3"}, {"k": "ビャ", "r": "bya", "a": "../kana/k-bya.mp3"}, {"k": "ビュ", "r": "byu", "a": "../kana/k-byu.mp3"}, {"k": "ビョ", "r": "byo", "a": "../kana/k-byo.mp3"}], [{"k": "ピャ", "r": "pya", "a": "../kana/k-pya.mp3"}, {"k": "ピュ", "r": "pyu", "a": "../kana/k-pyu.mp3"}, {"k": "ピョ", "r": "pyo", "a": "../kana/k-pyo.mp3"}, null, null, null]]}], "credits": "<b>Stroke order diagrams:</b> KanjiStrokeOrders font, Copyright (C) 2004-2020 Ulrich Apel, the AAAA project and the Wadoku project. Stroke numbers enlarged for this product. Used under the BSD-style licence below.<br><b>Tracing font:</b> Klee One, Copyright 2020 The Klee Project Authors (SIL Open Font License 1.1).<br><b>Text font:</b> Noto Sans / Noto Sans JP (SIL Open Font License 1.1).", "license": "KanjiStrokeOrders font, version 4.005 (kana-only subset made for this product)\nSource: https://sites.google.com/site/nihilistorguk/\n\nCopyright (C) 2004-2020 Ulrich Apel, the AAAA project and the Wadoku project\nAll rights reserved.\n\nRedistribution and use in source and binary forms, with or without\nmodification, are permitted provided that the following conditions\nare met:\n\n1. Redistributions of source code must retain the above copyright\n   notice, this list of conditions and the following disclaimer.\n2. Redistributions in binary form must reproduce the above copyright\n   notice, this list of conditions and the following disclaimer in the\n   documentation and/or other materials provided with the distribution.\n3. Neither the name of the author may be used to endorse o const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = id => DATA.scripts.find(s => s.id === id);
const cards = s => s.basic.flat().filter(Boolean);
const allCells = (s, set) => (set === "all" ? [...s.basic, ...s.dakuten, ...s.combo] : s.basic).flat().filter(Boolean);

// ---------- audio (same engine as the travel cards: plays on the same screen, works offline)
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, current = null, playingBtn = null;
const buffers = new Map();
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
function stopAudio() {
  if (current) { try { current.onended = null; current.stop(); } catch (e) {} current = null; }
  if (playingBtn) { playingBtn.classList.remove("on"); playingBtn = null; }
}
async function play(url, btn) {
  stopAudio();
  const me = btn || {classList: {remove() {}}};   // no button (tap on a chart cell) = nothing to animate
  if (btn) btn.classList.add("on");
  playingBtn = me;
  try {
    if (!AC) { const a = new Audio(url); a.onended = stopAudio; await a.play(); current = {stop: () => a.pause()}; return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    let buf = buffers.get(url);
    if (!buf) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const raw = await res.arrayBuffer();
      buf = await new Promise((ok, ng) => ctx.decodeAudioData(raw, ok, ng));
      buffers.set(url, buf);
    }
    if (playingBtn !== me) return;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    src.onended = () => { if (current === src) { current = null; stopAudio(); } };
    src.start(0); current = src;
  } catch (e) {
    stopAudio();
    toast("Sound could not load. Please connect to the internet once, then it works offline.");
  }
}
function toast(msg) {
  const d = document.createElement("div"); d.className = "err"; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}

// ---------- screens
function header(title, ja, back, col) {
  return `<header style="--hc:${col || "var(--navy)"}">${back ? `<button class="back" onclick="history.back()">◀ Back</button>` : ""}
    <h1>${title}${ja ? `<small>${ja}</small>` : ""}</h1></header>`;
}
function home() {
  let tip = "";
  try { if (!localStorage.getItem("tipClosed") && !matchMedia("(display-mode: standalone)").matches)
    tip = `<div class="tip" id="tip"><button onclick="closeTip()" aria-label="Close">×</button>
      <b>Tip:</b> add this page to your home screen to open it like an app.<br>
      iPhone: tap <b>Share</b> → <b>Add to Home Screen</b>.<br>Android: tap <b>⋮</b> → <b>Add to Home screen</b>.</div>`; } catch (e) {}
  const btns = DATA.scripts.map(s => `<button class="big-btn" style="background:${s.col}" onclick="go('#/s/${s.id}/basic')">
      <span>${s.en}</span><span class="ja">${s.ja}</span></button>`).join("");
  return header(DATA.title, DATA.titleJa) + `<div class="wrap home">
    <div class="hero"><div class="sun">あ</div><p>Tap any kana to hear it.<br>Then test yourself with the listening quiz.</p></div>
    ${tip}${btns}
    <button class="big-btn" style="background:#3C7A5A" onclick="go('#/q')"><span>Listening quiz</span><span class="ja">聞き取りクイズ</span></button>
    <p class="note">Start with hiragana: learn one row a day (あいうえお, then かきくけこ…).<br>
    Works offline after your first visit (all sounds are saved on your phone).</p>
    <details class="credits"><summary>Credits</summary><p>${DATA.credits}</p><pre>${esc(DATA.license)}</pre></details></div>`;
}
function closeTip() { try { localStorage.setItem("tipClosed", "1"); } catch (e) {} document.getElementById("tip")?.remove(); }
function chart(s, tab) {
  const rows = tab === "basic" ? s.basic : tab === "dakuten" ? s.dakuten : s.combo;
  const cols = rows[0].length;
  const cells = rows.flat().map(c => !c ? `<div class="cell e"></div>` :
    `<button class="cell" onclick="tapCell(this, '${s.id}', '${tab}', '${c.k}')"><div class="k">${c.k}</div><div class="r">${c.r}</div></button>`).join("");
  const t = (id, label) => `<button class="${tab === id ? "sel" : ""}" onclick="go('#/s/${s.id}/${id}', true)">${label}</button>`;
  return header(s.en, s.ja, true, s.col) + `<div class="wrap" style="--c:${s.col}">
    <div class="tabs">${t("basic", "Basic")}${t("dakuten", s.id === "hira" ? "が ぱ" : "ガ パ")}${t("combo", s.id === "hira" ? "きゃ" : "キャ")}</div>
    <div class="grid${cols > 5 ? " six" : ""}" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div>
    <p class="hint">${tab === "basic" ? "Tap a kana to hear it and see an example word." : "Tap to hear the sound."}</p></div>`;
}
function tapCell(btn, sid, tab, k) {
  const s = S(sid), c = allCells(s, "all").find(x => x.k === k);
  if (tab === "basic") { play(c.a); go(`#/k/${sid}/${cards(s).indexOf(c)}`); return; }
  document.querySelectorAll(".cell.on").forEach(x => x.classList.remove("on"));
  btn.classList.add("on"); play(c.a);
}
function card(s, i) {
  const list = cards(s), c = list[i];
  const word = c.w ? `<div class="ex"><div style="flex:1"><div class="lbl">Example word</div>
      <div class="w">${[...c.w.w].map(ch => ch === c.k ? `<b>${esc(ch)}</b>` : esc(ch)).join("")}</div>
      <div class="wr">${esc(c.w.r)}</div><div class="we">${esc(c.w.e)}</div></div>
      <button class="play sm" aria-label="Play word" onclick="play('${c.w.a}', this)">▶</button></div>`
    : `<div class="ex"><div class="we">No example word — this kana is almost never used today.</div></div>`;
  return header(s.en, s.ja, true, s.col) + `<div class="wrap card" style="--c:${s.col}">
    <div class="big"><img src="${c.so}" alt="${c.k}"></div><div class="sohint">red numbers = stroke order</div><div class="rom">${c.r}</div>${c.n ? `<div class="n">${esc(c.n)}</div>` : ""}
    <div style="margin-top:16px"><button class="play" aria-label="Play sound" onclick="play('${c.a}', this)">▶</button></div>
    ${word}
    <div class="nav"><button ${i ? "" : "disabled"} onclick="go('#/k/${s.id}/${i - 1}', true)">‹ ${i ? list[i - 1].k : ""}</button>
      <span style="color:#aaa;font-size:13px">${i + 1} / ${list.length}</span>
      <button ${i < list.length - 1 ? "" : "disabled"} onclick="go('#/k/${s.id}/${i + 1}', true)">${i < list.length - 1 ? list[i + 1].k : ""} ›</button></div></div>`;
}

// ---------- listening quiz: hear a sound, pick the kana
let Q = null;
let qset = {script: "hira", set: "basic"};
try { Object.assign(qset, JSON.parse(localStorage.getItem("qset") || "{}")); } catch (e) {}
function quizStart() {
  const o = (key, val, label) => `<button class="${qset[key] === val ? "sel" : ""}" onclick="qset.${key}='${val}';render()">${label}</button>`;
  return header("Listening quiz", "聞き取りクイズ", true, "#3C7A5A") + `<div class="wrap quiz">
    <p style="font-size:16px;line-height:1.5;margin:6px 0 18px">Listen to the sound, then tap the matching kana. 10 questions.</p>
    <div class="opt-row">${o("script", "hira", "Hiragana")}${o("script", "kata", "Katakana")}${o("script", "both", "Both")}</div>
    <div class="opt-row">${o("set", "basic", "Basic 46")}${o("set", "all", "All sounds")}</div>
    <button class="go" onclick="newQuiz()">Start ▶</button></div>`;
}
function pool() {
  const ids = qset.script === "both" ? ["hira", "kata"] : [qset.script];
  return ids.flatMap(id => allCells(S(id), qset.set).map(c => ({...c, sid: id})));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newQuiz(only) {
  try { localStorage.setItem("qset", JSON.stringify(qset)); } catch (e) {}
  const p = pool();
  const qs = only && only.length ? shuffle([...only]) : shuffle([...p]).slice(0, 10);
  Q = {pool: p, qs, i: 0, right: 0, missed: [], answered: false};
  go("#/q/play"); setTimeout(() => sayQ(), 250);
}
function sayQ() { const b = document.getElementById("qplay"); if (Q && b) play(Q.qs[Q.i].a, b); }
function quizPlay() {
  if (!Q) return quizStart();
  const q = Q.qs[Q.i];
  if (!Q.choices) {
    // 3 wrong answers with a different sound, from the same script so the shapes are comparable
    const others = shuffle(Q.pool.filter(c => c.r !== q.r && c.sid === q.sid && [...c.k].length === [...q.k].length));
    Q.choices = shuffle([q, ...others.slice(0, 3)]);
  }
  const ch = Q.choices.map((c, n) => `<button id="c${n}" onclick="answer(${n})">${c.k}<small></small></button>`).join("");
  return header("Listening quiz", "", true, "#3C7A5A") + `<div class="wrap quiz">
    <div class="qtop"><span>Question ${Q.i + 1} / ${Q.qs.length}</span><span>✓ ${Q.right}</span></div>
    <button class="play" id="qplay" style="--c:#3C7A5A;width:88px;height:88px;font-size:32px" onclick="sayQ()" aria-label="Play again">▶</button>
    <p class="hint" style="padding-top:10px">Tap ▶ to hear it again</p>
    <div class="choices">${ch}</div><div id="after"></div></div>`;
}
function answer(n) {
  if (Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.i], ok = Q.choices[n].k === q.k;
  Q.choices.forEach((c, m) => { document.querySelector(`#c${m} small`).textContent = c.r; });
  const right = Q.choices.findIndex(c => c.k === q.k);
  document.getElementById("c" + right).classList.add("ok");
  if (ok) Q.right++; else { document.getElementById("c" + n).classList.add("ng"); Q.missed.push(q); }
  play(q.a);
  const last = Q.i === Q.qs.length - 1;
  document.getElementById("after").innerHTML = `<button class="go" onclick="nextQ()">${last ? "See score" : "Next ›"}</button>`;
}
function nextQ() {
  Q.i++; Q.choices = null; Q.answered = false;
  if (Q.i >= Q.qs.length) return go("#/q/done", true);
  render(); setTimeout(sayQ, 150);
}
function quizDone() {
  if (!Q) return quizStart();
  const m = Q.missed;
  return header("Listening quiz", "", true, "#3C7A5A") + `<div class="wrap quiz">
    <div class="score">${Q.right} / ${Q.qs.length}</div>
    <p style="font-size:17px">${Q.right === Q.qs.length ? "Perfect! よくできました！" : Q.right >= 7 ? "Great job! Keep going." : "Good practice! Try again."}</p>
    ${m.length ? `<p style="margin-top:18px;color:#666">Practice these again:</p><div class="missed">${m.map(c => c.k).join(" ")}</div>
      <button class="go" onclick="newQuiz(Q.missed)">Practice missed (${m.length})</button>` : ""}
    <button class="go ${m.length ? "alt" : ""}" onclick="newQuiz()">New quiz</button>
    <button class="go alt" onclick="go('#/q', true)">Change settings</button></div>`;
}

function go(hash, replace) { replace ? location.replace(hash) : (location.hash = hash); }
function render() {
  if (!location.hash.startsWith("#/q/play")) stopAudio();
  const h = location.hash.split("/"), s = S(h[2]);
  if (h[1] === "s" && s) app.innerHTML = chart(s, ["basic", "dakuten", "combo"].includes(h[3]) ? h[3] : "basic");
  else if (h[1] === "k" && s && cards(s)[+h[3]]) app.innerHTML = card(s, +h[3]);
  else if (h[1] === "q" && h[2] === "play") app.innerHTML = quizPlay();
  else if (h[1] === "q" && h[2] === "done") app.innerHTML = quizDone();
  else if (h[1] === "q") app.innerHTML = quizStart();
  else app.innerHTML = home();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();

if ("serviceWorker" in navigator) {
  const hadOld = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOld) location.reload(); });
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
}
