<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GF Japan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Gluten-Free Japan Cards</title>
<style>
:root { --navy:#1F3A5F; --cream:#FBF8F2; --ink:#1d1d1f;
  --ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",sans-serif;
  --en:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--cream); color:var(--ink); font-family:var(--en); }
body { padding-bottom:env(safe-area-inset-bottom); }
button { font:inherit; border:0; cursor:pointer; color:inherit; background:none; }
.ja { font-family:var(--ja); }
.wrap { max-width:640px; margin:0 auto; }

header { position:sticky; top:0; z-index:5; background:var(--navy); color:var(--cream);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; display:flex; align-items:center; gap:12px; min-height:56px; }
header h1 { font-size:18px; font-weight:700; flex:1; line-height:1.2; }
header h1 small { display:block; font-family:var(--ja); font-weight:400; font-size:12px; opacity:.8; }
.back { font-size:16px; font-weight:600; padding:8px 12px; margin:-8px 0 -8px -8px; border-radius:20px; }
.back:active { background:rgba(255,255,255,.15); }

.home { padding:16px; }
.hero { text-align:center; padding:12px 0 18px; }
.hero .sun { width:72px; height:72px; border-radius:50%; background:#C0392B; margin:0 auto 12px; }
.hero p { font-size:15px; line-height:1.5; color:#444; }
.cat { display:flex; align-items:center; justify-content:space-between; width:100%; padding:18px 18px; margin-bottom:10px;
  border-radius:14px; color:#fff; font-size:19px; font-weight:700; text-align:left; box-shadow:0 2px 6px rgba(0,0,0,.08); }
.cat .ja { font-size:14px; font-weight:400; opacity:.9; }
.cat:active { transform:scale(.98); }
.note { font-size:13px; line-height:1.5; color:#666; margin:18px 4px 8px; }
.tip { background:#fff; border:1px solid #e6e0d4; border-radius:12px; padding:12px 36px 12px 14px; font-size:14px; line-height:1.5; margin-bottom:14px; position:relative; }
.tip button { position:absolute; right:6px; top:4px; font-size:20px; color:#999; padding:4px 8px; }

.list { padding:12px 12px 24px; }
.card { background:#fff; border-radius:16px; margin-bottom:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); border-left:6px solid var(--c); }
.card .show { display:block; width:100%; text-align:center; padding:18px 10px 10px; }
.card .jp { font-family:var(--ja); font-weight:700; line-height:1.45; white-space:nowrap; }
.card .hint { font-size:12px; color:#999; margin-top:6px; }
.card .row { display:flex; align-items:center; gap:12px; padding:12px 14px 14px; border-top:1px solid #f0ebe1; }
.card .txt { flex:1; min-width:0; }
.en { font-size:17px; font-weight:600; line-height:1.35; }
.ro { font-size:15px; color:#666; font-style:italic; margin-top:3px; }
.play { flex:none; width:56px; height:56px; border-radius:50%; background:var(--c); color:#fff; font-size:22px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.15); }
.play:active { transform:scale(.94); }
.play.on { animation:pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(0,0,0,.08); } }

/* full-screen "show the staff" view */
.full { position:fixed; inset:0; z-index:10; background:var(--cream); display:flex; flex-direction:column; overflow-y:auto; }
.full .band { background:var(--c); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; justify-content:space-between; font-weight:600; min-height:52px; }
.full .band button { font-size:16px; padding:6px 10px; margin-right:-8px; }
.full .please { font-family:var(--ja); text-align:center; color:#777; font-size:15px; margin-top:18px; }
.full .jp { flex:1 0 auto; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 4vw;
  font-family:var(--ja); font-weight:700; line-height:1.45; white-space:nowrap; }
.full .row { display:flex; align-items:center; gap:14px; background:#fff; border-top:1px solid #e6e0d4;
  padding:16px 18px calc(env(safe-area-inset-bottom) + 18px); }
.full .row .txt { flex:1; }
.full .nav { display:flex; gap:8px; }
.full .nav button { height:44px; padding:0 16px; border-radius:22px; background:#eee8dc; font-size:18px; color:#555; }

.sos .item { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:12px; border-left:6px solid #C0392B; display:block; color:inherit; text-decoration:none; }
.sos .big { font-size:30px; font-weight:800; color:#C0392B; }
.sos .lbl { font-size:15px; margin-top:2px; }
.sos .lbl span { font-family:var(--ja); color:#666; font-size:13px; }
.guide { padding:16px 18px 28px; font-size:16px; line-height:1.55; }
.guide h3 { font-size:18px; margin:18px 0 6px; padding-left:10px; border-left:6px solid #999; }
.guide h3.no { border-color:#C0392B; } .guide h3.ask { border-color:#C28A1E; } .guide h3.ok { border-color:#3C7A5A; }
.guide p { margin-bottom:12px; }
.guide .small { font-size:14px; color:#666; }
.guide table { width:100%; border-collapse:collapse; margin:6px 0 14px; background:#fff; border-radius:10px; overflow:hidden; }
.guide td { padding:9px 10px; border-bottom:1px solid #eee; }
.guide .ja { font-weight:700; }
.err { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:20; background:#333; color:#fff;
  border-radius:12px; padding:12px 16px; font-size:14px; text-align:center; }
</style>
</head><body>
<div id="app"></div>
<script>
const DATA = {"title": "Gluten-Free Japan Cards", "titleJa": "グルテンフリー 日本語カード", "hero": "Show the big Japanese to staff.<br>Tap ▶ to hear it.", "note": "These cards help you explain your needs. They are not a medical guarantee. Many kitchens share oil and tools. Always carry your own medicine and gluten-free soy sauce.", "cats": [{"id": "main", "en": "Show First", "ja": "最初に見せる", "col": "#9C4A1A", "cards": [{"en": "I have celiac disease. Even a small amount of wheat, barley or rye makes me sick.", "jp": "セリアック病です。\n小麦・大麦・ライ麦を\n少しでも食べると、\n体調が悪くなります。", "ro": "Seriakku-byō desu. Komugi, ōmugi, raimugi o sukoshi demo taberu to, taichō ga waruku narimasu.", "audio": "../gluten-free/main-01.mp3"}, {"en": "Soy sauce, miso and many sauces can contain wheat. Could you check the seasonings too?", "jp": "しょうゆ・みそ・たれにも\n小麦が入っていることが\nあります。\n調味料も確認して\nいただけますか？", "ro": "Shōyu, miso, tare ni mo komugi ga haitte iru koto ga arimasu. Chōmiryō mo kakunin shite itadakemasu ka?", "audio": "../gluten-free/main-02.mp3"}, {"en": "I have a wheat allergy. I cannot eat even a small amount. Soy sauce contains wheat too.", "jp": "小麦アレルギーです。\n少しでも\n食べられません。\nしょうゆにも\n小麦が入っています。", "ro": "Komugi arerugī desu. Sukoshi demo taberaremasen. Shōyu ni mo komugi ga haitte imasu.", "audio": "../gluten-free/main-03.mp3"}, {"en": "If you are not sure, that's OK. I will choose something else.", "jp": "わからない場合は、\n大丈夫です。\nほかの料理にします。", "ro": "Wakaranai baai wa, daijōbu desu. Hoka no ryōri ni shimasu.", "audio": "../gluten-free/main-04.mp3"}]}, {"id": "ask", "en": "Questions to Ask", "ja": "確認の質問", "col": "#2B4C7E", "cards": [{"en": "Does this dish contain wheat?", "jp": "この料理に、\n小麦は\n入っていますか？", "ro": "Kono ryōri ni, komugi wa haitte imasu ka?", "audio": "../gluten-free/ask-01.mp3"}, {"en": "Does this dish use soy sauce?", "jp": "この料理に、\nしょうゆは\n使っていますか？", "ro": "Kono ryōri ni, shōyu wa tsukatte imasu ka?", "audio": "../gluten-free/ask-02.mp3"}, {"en": "Do you have gluten-free soy sauce?", "jp": "グルテンフリーの\nしょうゆは\nありますか？", "ro": "Guruten furī no shōyu wa arimasu ka?", "audio": "../gluten-free/ask-03.mp3"}, {"en": "May I use my own gluten-free soy sauce?", "jp": "持ってきた\nグルテンフリーの\nしょうゆを\n使ってもいいですか？", "ro": "Motte kita guruten furī no shōyu o tsukatte mo ii desu ka?", "audio": "../gluten-free/ask-04.mp3"}, {"en": "Does the miso contain barley or wheat?", "jp": "このみそに、\n麦は\n入っていますか？", "ro": "Kono miso ni, mugi wa haitte imasu ka?", "audio": "../gluten-free/ask-05.mp3"}, {"en": "Is it coated in flour or breadcrumbs?", "jp": "小麦粉や\nパン粉を\n使っていますか？", "ro": "Komugiko ya panko o tsukatte imasu ka?", "audio": "../gluten-free/ask-06.mp3"}, {"en": "Is it fried in the same oil as tempura or breaded food?", "jp": "天ぷらやフライと\n同じ油で\n揚げていますか？", "ro": "Tenpura ya furai to onaji abura de agete imasu ka?", "audio": "../gluten-free/ask-07.mp3"}, {"en": "Is the soba 100% buckwheat? Is it boiled in the same water as udon?", "jp": "そばは\n十割そばですか？\nうどんと同じお湯で\nゆでていますか？", "ro": "Soba wa juwari soba desu ka? Udon to onaji oyu de yudete imasu ka?", "audio": "../gluten-free/ask-08.mp3"}, {"en": "Do the fish cakes (kamaboko, chikuwa) contain wheat?", "jp": "かまぼこ・ちくわに、\n小麦は\n入っていますか？", "ro": "Kamaboko, chikuwa ni, komugi wa haitte imasu ka?", "audio": "../gluten-free/ask-09.mp3"}, {"en": "Is this tea barley tea (mugicha)?", "jp": "このお茶は\n麦茶ですか？", "ro": "Kono ocha wa mugicha desu ka?", "audio": "../gluten-free/ask-10.mp3"}, {"en": "May I see the ingredient label?", "jp": "原材料の表示を\n見せて\nいただけますか？", "ro": "Genzairyō no hyōji o misete itadakemasu ka?", "audio": "../gluten-free/ask-11.mp3"}]}, {"id": "order", "en": "Ordering Safely", "ja": "安全な頼み方", "col": "#3C7A5A", "cards": [{"en": "Can you make it without soy sauce or sauce?", "jp": "しょうゆやたれを\n使わずに\n作っていただけますか？", "ro": "Shōyu ya tare o tsukawazu ni tsukutte itadakemasu ka?", "audio": "../gluten-free/order-01.mp3"}, {"en": "Salt instead of sauce, please. (yakitori)", "jp": "たれではなく、\n塩で\nお願いします。", "ro": "Tare de wa naku, shio de onegaishimasu.", "audio": "../gluten-free/order-02.mp3"}, {"en": "No sauce or dressing, please.", "jp": "ソースや\nドレッシングは\nかけないでください。", "ro": "Sōsu ya doresshingu wa kakenaide kudasai.", "audio": "../gluten-free/order-03.mp3"}, {"en": "Plain white rice, please.", "jp": "白いご飯を\nお願いします。", "ro": "Shiroi gohan o onegaishimasu.", "audio": "../gluten-free/order-04.mp3"}, {"en": "Is there any dish on the menu without wheat?", "jp": "小麦を\n使っていない料理は\nありますか？", "ro": "Komugi o tsukatte inai ryōri wa arimasu ka?", "audio": "../gluten-free/order-05.mp3"}, {"en": "Thank you very much for checking.", "jp": "確認してくださって、\nありがとう\nございます。", "ro": "Kakunin shite kudasatte, arigatō gozaimasu.", "audio": "../gluten-free/order-06.mp3"}]}, {"id": "shop", "en": "Shopping", "ja": "買い物", "col": "#7A3E6B", "cards": [{"en": "Does this contain wheat or barley? (show a package)", "jp": "これに、\n小麦や大麦は\n入っていますか？", "ro": "Kore ni, komugi ya ōmugi wa haitte imasu ka?", "audio": "../gluten-free/shop-01.mp3"}, {"en": "Where are the gluten-free products?", "jp": "グルテンフリーの\n商品は\nどこにありますか？", "ro": "Guruten furī no shōhin wa doko ni arimasu ka?", "audio": "../gluten-free/shop-02.mp3"}]}], "guides": [{"id": "food", "en": "Food Guide", "ja": "料理ガイド", "html": "\n<h3 class=\"no\">Usually contains gluten — avoid</h3>\n<p>Ramen, udon, sōmen, most soba (mixed with wheat), tempura, tonkatsu, karaage (flour coating), gyōza,\nokonomiyaki, takoyaki, Japanese curry, teriyaki, sukiyaki, yakitori with tare sauce, unagi (eel) sauce,\nfu (wheat gluten), panko-fried foods, beer, mugicha (barley tea).</p>\n<h3 class=\"ask\">Ask first — often hidden</h3>\n<p>Miso soup (some miso has barley), tamagoyaki (rolled egg; may use soy sauce), sushi (soy sauce, eel sauce,\nimitation crab), kamaboko / chikuwa (fish cakes), dipping sauces (tsuyu, ponzu, sesame sauce), salad dressings,\ninstant dashi and seasoning mixes, rice crackers (senbei; often soy sauce).</p>\n<h3 class=\"ok\">Usually safer — still ask</h3>\n<p>Plain white rice, sashimi with your own gluten-free soy sauce, yakitori with salt (shio),\n100% buckwheat soba (jūwari) with your own sauce, edamame, grilled fish with salt (shioyaki), fruit.</p>\n<p class=\"small\">Many kitchens share oil, water and tools. Always ask, and carry your own gluten-free soy sauce (tamari).</p>\n"}, {"id": "labels", "en": "Reading Food Labels", "ja": "食品表示の読み方", "html": "\n<p>Look for these words in the ingredient list (<span class=\"ja\">原材料名</span>):</p>\n<table>\n<tr><td class=\"ja\">小麦</td><td>komugi</td><td>wheat</td></tr>\n<tr><td class=\"ja\">小麦粉</td><td>komugiko</td><td>wheat flour</td></tr>\n<tr><td class=\"ja\">大麦</td><td>ōmugi</td><td>barley</td></tr>\n<tr><td class=\"ja\">ライ麦</td><td>raimugi</td><td>rye</td></tr>\n<tr><td class=\"ja\">麦</td><td>mugi</td><td>any of these grains</td></tr>\n<tr><td class=\"ja\">麦芽</td><td>bakuga</td><td>malt</td></tr>\n<tr><td class=\"ja\">しょうゆ・醤油</td><td>shōyu</td><td>soy sauce (usually has wheat)</td></tr>\n<tr><td class=\"ja\">グルテン</td><td>guruten</td><td>gluten</td></tr>\n<tr><td class=\"ja\">パン粉</td><td>panko</td><td>breadcrumbs</td></tr>\n</table>\n<p><b>Important:</b> in Japan, <b>wheat must be labeled</b> on packaged food (it is a required allergen).\n<b>Barley and rye do not have to be labeled as allergens.</b> Read the full ingredient list, not only the allergy box.</p>\n<p>Allergy info often looks like <span class=\"ja\">（一部に小麦・大豆を含む）</span> = “contains some wheat and soy”.</p>\n"}], "sos": [{"num": "110", "en": "Police", "ja": "警察"}, {"num": "119", "en": "Ambulance / Fire", "ja": "救急車・消防"}, {"num": "050-3816-2787", "en": "Japan Visitor Hotline (JNTO, 24h, English)", "ja": "訪日外国人向けホットライン"}]};
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const br = s => esc(s).replace(/\n/g, "<br>");
const longest = s => Math.max(...s.split("\n").map(l => l.length));
const total = DATA.cats.reduce((n, c) => n + c.cards.length, 0);

// ---------- audio: plays on the same screen (Web Audio works offline and on iPhone)
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, current = null, playingBtn = null;
const buffers = new Map();
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}  // iPhone: play even in silent mode

function stopAudio() {
  if (current) { try { current.onended = null; current.stop(); } catch (e) {} current = null; }
  if (playingBtn) { playingBtn.classList.remove("on"); playingBtn = null; }
}
async function play(url, btn) {
  const same = playingBtn === btn;
  stopAudio();
  if (same) return;  // second tap = stop
  btn.classList.add("on"); playingBtn = btn;
  try {
    if (!AC) { const a = new Audio(url); a.onended = stopAudio; await a.play(); current = {stop: () => a.pause()}; return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    let buf = buffers.get(url);
    if (!buf) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const raw = await res.arrayBuffer();
      buf = await new Promise((ok, ng) => ctx.decodeAudioData(raw, ok, ng));
      buffers.set(url, buf);
    }
    if (playingBtn !== btn) return;  // user tapped something else meanwhile
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    src.onended = () => { if (current === src) { current = null; stopAudio(); } };
    src.start(0); current = src;
  } catch (e) {
    stopAudio();
    toast("Sound could not load. Please connect to the internet once, then it works offline.");
  }
}
function toast(msg) {
  const d = document.createElement("div"); d.className = "err"; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}

// ---------- screens (the address after # keeps the phone's Back button working)
function header(title, ja, back) {
  return `<header>${back ? `<button class="back" onclick="history.back()">◀ Back</button>` : ""}
    <h1>${title}${ja ? `<small>${ja}</small>` : ""}</h1></header>`;
}
function home() {
  let tip = "";
  try { if (!localStorage.getItem("tipClosed") && !matchMedia("(display-mode: standalone)").matches)
    tip = `<div class="tip" id="tip"><button onclick="closeTip()" aria-label="Close">×</button>
      <b>Tip:</b> add this page to your home screen to open it like an app.<br>
      iPhone: tap <b>Share</b> → <b>Add to Home Screen</b>.<br>Android: tap <b>⋮</b> → <b>Add to Home screen</b>.</div>`; } catch (e) {}
  const cats = DATA.cats.map(c => `<button class="cat" style="background:${c.col}" onclick="go('#/c/${c.id}')">
      <span>${c.en}</span><span class="ja">${c.ja}</span></button>`).join("");
  const guides = DATA.guides.map(g => `<button class="cat" style="background:#6b6255" onclick="go('#/g/${g.id}')">
      <span>${g.en}</span><span class="ja">${g.ja}</span></button>`).join("");
  return header(DATA.title, DATA.titleJa) + `<div class="wrap home">
    <div class="hero"><div class="sun"></div><p>${total} cards. ${DATA.hero}</p></div>
    ${tip}${cats}${guides}
    <button class="cat" style="background:#555" onclick="go('#/sos')"><span>Emergency numbers</span><span class="ja">緊急電話番号</span></button>
    <p class="note">Works offline after your first visit (cards and sound).<br>
    ${DATA.note}</p></div>`;
}
function guide(g) {
  return header(g.en, g.ja, true) + `<div class="wrap list guide">${g.html}</div>`;
}
function closeTip() { try { localStorage.setItem("tipClosed", "1"); } catch (e) {} document.getElementById("tip")?.remove(); }
function category(c) {
  const cards = c.cards.map((p, i) => {
    const size = Math.min(28, 250 / longest(p.jp));
    return `<div class="card" style="--c:${c.col}">
      <button class="show" onclick="go('#/p/${c.id}/${i}')"><div class="jp" style="font-size:min(${size}px, ${(size / 3.6).toFixed(2)}vw)">${br(p.jp)}</div>
        <div class="hint">Tap to show full screen</div></button>
      <div class="row"><div class="txt"><div class="en">${esc(p.en)}</div><div class="ro">${esc(p.ro)}</div></div>
        <button class="play" aria-label="Play sound" onclick="play('${p.audio}', this)">▶</button></div></div>`;
  }).join("");
  return header(c.en, c.ja, true) + `<div class="wrap list">${cards}</div>`;
}
function full(c, i) {
  const p = c.cards[i], lines = p.jp.split("\n").length, L = longest(p.jp);
  // largest size where the longest line fits the width and all lines fit the height
  const size = `min(${(92 / L).toFixed(2)}vw, ${(42 / (lines * 1.45)).toFixed(2)}vh, 120px)`;
  return `<div class="full" style="--c:${c.col}">
    <div class="band"><span>${c.en}</span><button onclick="history.back()">✕ Close</button></div>
    <div class="please">この画面をご覧ください</div>
    <div class="jp" style="font-size:${size}">${br(p.jp)}</div>
    <div class="row"><div class="txt"><div class="en">${esc(p.en)}</div><div class="ro">${esc(p.ro)}</div></div>
      <button class="play" aria-label="Play sound" onclick="play('${p.audio}', this)">▶</button></div>
    <div class="row" style="padding-top:0;border:0;justify-content:space-between">
      <div class="nav">${i > 0 ? `<button onclick="go('#/p/${c.id}/${i - 1}', true)">‹ Prev</button>` : ""}</div>
      <span style="color:#aaa;font-size:13px">${i + 1} / ${c.cards.length}</span>
      <div class="nav">${i < c.cards.length - 1 ? `<button onclick="go('#/p/${c.id}/${i + 1}', true)">Next ›</button>` : ""}</div></div></div>`;
}
function sos() {
  const rows = DATA.sos.map(s => `<a class="item" href="tel:${s.num.replace(/-/g, "")}">
    <div class="big">${s.num}</div><div class="lbl">${s.en} <span>${s.ja}</span></div></a>`).join("");
  return header("Emergency numbers", "緊急電話番号", true) + `<div class="wrap list sos">${rows}
    <p class="note">Tap a number to call. Calls to 110 and 119 are free from any phone.
    Say “Eigo de onegaishimasu” (English, please).</p></div>`;
}
function go(hash, replace) { replace ? location.replace(hash) : (location.hash = hash); }
function render() {
  stopAudio();
  const h = location.hash.split("/");
  const c = DATA.cats.find(x => x.id === h[2]);
  if (h[1] === "c" && c) app.innerHTML = category(c);
  else if (h[1] === "p" && c && c.cards[+h[3]]) app.innerHTML = full(c, +h[3]);
  else if (h[1] === "sos") app.innerHTML = sos();
  else if (h[1] === "g" && DATA.guides.find(x => x.id === h[2])) app.innerHTML = guide(DATA.guides.find(x => x.id === h[2]));
  else app.innerHTML = home();
  if (h[1] !== "p") window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();

if ("serviceWorker" in navigator) {
  // when a new version has been saved, reload once so the new cards and sounds are used right away
  const hadOld = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOld) location.reload(); });
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
}
</script>
